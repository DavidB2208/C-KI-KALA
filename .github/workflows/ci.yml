name: Verify C KI KA LA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check source hygiene
        run: pnpm check:source
      - name: Check types
        run: pnpm typecheck
      - name: Test ranking engine
        run: pnpm test
      - name: Build Worker and client
        run: pnpm build
      - name: Test accounts, game and Squads
        run: pnpm test:integration
      - name: Test payment integration with simulated provider
        run: pnpm test:billing
      - name: Test a clean local startup and independent player tabs
        run: pnpm test:local
